#cloud-config
# First-boot setup for the WhatsApp relay VM. The binary itself is built and
# installed by deploy.sh. The message log lives on a volume whose ext4
# filesystem is labeled whatsapp-data; it's mounted at /var/lib/whatsapp
# whenever it's attached (nofail: the machine still boots without it, and the
# service then refuses to start rather than run on an empty directory).
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - rsync
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: whatsapp
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
mounts:
  - [LABEL=whatsapp-data, /var/lib/whatsapp, ext4, "defaults,nofail,discard", "0", "2"]
runcmd:
  # Caddy from its official apt repo.
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - install -d -o root -g whatsapp -m 0750 /etc/whatsapp
  # The whatsapp user's uid can differ from the machine that wrote the volume.
  - if mountpoint -q /var/lib/whatsapp; then chown whatsapp:whatsapp /var/lib/whatsapp && chmod 0700 /var/lib/whatsapp && find /var/lib/whatsapp -mindepth 1 -maxdepth 1 ! -name lost+found -exec chown -R whatsapp:whatsapp {} +; fi
