#cloud-config
# First-boot setup for the WhatsApp relay VM. The binary itself is built and
# installed by deploy.sh. The message log lives on a volume whose ext4
# filesystem is labeled whatsapp-data; it's mounted at /var/lib/whatsapp
# whenever it's attached (nofail: the machine still boots without it, and the
# service then refuses to start rather than run on an empty directory). The
# server has no public address: create it on the private network only,
# behind the edge, which proxies HTTPS to it and NATs its outbound traffic.
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - rsync
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: whatsapp
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
mounts:
  - [LABEL=whatsapp-data, /var/lib/whatsapp, ext4, "defaults,nofail,discard", "0", "2"]
bootcmd:
  # Hetzner gives a private-only server no default route and no DNS: send
  # its traffic through the network gateway to the edge's NAT. It goes in
  # netplan, since a plain route is lost when the package upgrade restarts
  # systemd-networkd.
  - |
    iface=$(ip -o -4 addr show to 10.0.0.0/16 | awk '{print $2; exit}')
    printf 'network:\n  version: 2\n  ethernets:\n    %s:\n      routes:\n      - to: default\n        via: 10.0.0.1\n        on-link: true\n      nameservers:\n        addresses: [185.12.64.1, 185.12.64.2]\n' "$iface" > /etc/netplan/60-edge-nat.yaml
    chmod 600 /etc/netplan/60-edge-nat.yaml
    netplan apply
runcmd:
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  - ufw allow OpenSSH && ufw allow from 10.0.0.0/16 to any port 8751 proto tcp && ufw --force enable
  - install -d -o root -g whatsapp -m 0750 /etc/whatsapp
  # The whatsapp user's uid can differ from the machine that wrote the volume.
  - if mountpoint -q /var/lib/whatsapp; then chown whatsapp:whatsapp /var/lib/whatsapp && chmod 0700 /var/lib/whatsapp && find /var/lib/whatsapp -mindepth 1 -maxdepth 1 ! -name lost+found -exec chown -R whatsapp:whatsapp {} +; fi
